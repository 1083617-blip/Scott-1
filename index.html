<style>
/* Basic imports and original styles preserved */

<!-- Admin note: keep UncJohn admin code here (client-side) per user instruction -->
<script>
/*
  Features added:
  - Per-user accounts stored in localStorage.
  - Must sign up / sign in (or continue as Guest) before using site.
  - Items can be equipped and unequipped; Unequip Everything reverts visuals but
    preserves ownership.
  - VIP area requires admin code UncJohn to grant VIP/admin access to current user.
  - EscapeRoad-style games are automatically marked VIP-only if their name includes "escape".
*/

/* ---------- storage keys and user system ---------- */
const USERS_KEY = 'scott1Users_v1';
const CURRENT_USER_KEY = 'scott1CurrentUser_v1';
let users = {}; // username => {passwordHash, coins, owned:[], plays, badgeClicks, activeEffects:[], isAdmin, isVIP, settings:{}}
let currentUser = null; // username string or null (guest)

// Clear persisted progress on every load so refresh resets state
function resetProgressOnLoad(){
  try{ localStorage.removeItem(USERS_KEY); localStorage.removeItem(CURRENT_USER_KEY); }catch(e){}
  users = {};
  currentUser = null;
}

function loadUsers(){
  try{
    const raw = localStorage.getItem(USERS_KEY);
    users = raw ? JSON.parse(raw) : {};
  }catch(e){ users = {}; }
}
function saveUsers(){
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}
function setCurrentUser(username){
  // clear visuals from previous session so a different user doesn't inherit them
  clearSessionVisuals();
  const prev = currentUser;
  currentUser = username;
  localStorage.setItem(CURRENT_USER_KEY, username||'');
  applyUserStateToUI();
  // if signed in as a user, apply their owned items / active effects
  if(currentUser && users[currentUser]){
    const u = users[currentUser];
    (u.owned||[]).forEach(id=>{ const it = SHOP_ITEMS.find(s=>s.id===id); if(it && it.apply) try{ it.apply(); }catch(e){} });
    (u.activeEffects||[]).forEach(id=>{ const it = SHOP_ITEMS.find(s=>s.id===id); if(it && it.apply) try{ it.apply(); }catch(e){} });
    if(u.activeGradient) document.body.classList.add(u.activeGradient);
  }
  // refresh game list visuals (stars, vip flags)
  rebuildGames();
  createBadges(25);
  updateCoins();
}

// Remove visual-only session artifacts without altering stored user data
function clearSessionVisuals(){
  // remove floating badges, snow, matrix, pet, sparks, RGB style, party, cursor
  document.querySelectorAll('.badge').forEach(e=>e.remove());
  document.querySelectorAll('.snowflake').forEach(e=>e.remove());
  document.querySelectorAll('.matrix-drop').forEach(e=>e.remove());
  const pet=document.getElementById('petBadge'); if(pet) pet.remove();
  const rgb=document.getElementById('rgbStyle'); if(rgb) rgb.remove();
  document.body.classList.remove('party','team-cursor');
  // remove any spark handlers
  if(typeof sparkHandler === 'function'){ document.removeEventListener('click', sparkHandler); sparkHandler=null; }
  // reset flags
  matrixRainOn=false; snowOn=false; sparksOn=false; petOn=false; soundOn=false;
  // remove temporary panels
  ['favPanel','shopPanel','recentPanel','adminPanel','vipPanel'].forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.remove('open'); });
}
function getUserObj(u){
  return users[u] || null;
}

/* very small sha256 helper using SubtleCrypto for password hashing (async) */
async function sha256Hex(str){
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      const enc = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ console.warn('SubtleCrypto failed:',e); }
  // fallback (not cryptographically secure) for older contexts — demo only
  try{ return btoa(unescape(encodeURIComponent(str))).slice(0,64); }catch(e){ return String(str); }
}

/* register/login */
async function registerUser(username, password){
  username = username.trim();
  if(!username || !password) throw 'Missing username or password';
  if(users[username]) throw 'Username already exists';
  const hash = await sha256Hex(password);
  users[username] = { passwordHash: hash, coins: 0, owned: [], plays: 0, badgeClicks: 0, activeEffects: [], isAdmin: false, isVIP:false, settings:{} };
  saveUsers();
}
async function loginUser(username, password){
  username = username.trim();
  if(!users[username]) throw 'No such user';
  const hash = await sha256Hex(password);
  if(users[username].passwordHash !== hash) throw 'Wrong password';
  setCurrentUser(username);
}
function logoutUser(){
  setCurrentUser(null);
  toast('Logged out. Refresh to log in again or create a new account.');
}

/* init user system and UI */
resetProgressOnLoad();
loadUsers();
const savedCur = localStorage.getItem(CURRENT_USER_KEY) || '';
if(savedCur && users[savedCur]) setCurrentUser(savedCur);
else setCurrentUser(null);

/* ---------- UI helpers and toast ---------- */
function toast(msg){
  let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2500);
}

/* ---------- per-user coin/own/equip helpers ---------- */
function ensureUser(){
  if(!currentUser){
    toast('Please sign in first.');
    return false;
  }
  if(!users[currentUser]){ setCurrentUser(null); toast('User not found. Please sign in.'); return false; }
  return true;
}
function userData(){ return users[currentUser]; }

function userAddCoins(n,x,y){
  if(!ensureUser()) return;
  const u = userData();
  // item doubleCoins and luckyCharm apply
  let amt = n;
  if(u.owned.includes('doubleCoins')) amt *= 2;
  if(u.owned.includes('luckyCharm') && Math.random()<0.1){ amt *= 5; toast('🍀 LUCKY! x5 coins!'); }
  u.coins += amt; saveUsers(); updateCoins();
  const pop = document.createElement('div'); pop.className='coin-pop'; pop.textContent='+'+amt+' 🪙'; pop.style.left=(x||window.innerWidth/2)+'px'; pop.style.top=(y||100)+'px'; document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),900);
}
function updateCoins(){ const c=document.getElementById('coinCounter'); if(!c) return; const u = currentUser ? users[currentUser] : null; c.textContent = (u ? (u.isAdmin? '🛡️ ':'') + '🪙 ' + u.coins : '🪙 —'); }
function userEarn(base,x,y){ if(!ensureUser()) return; userAddCoins(base,x,y); blip(); }

/* ---------- Equip / Unequip logic ---------- */
function applyEffectById(id){
  // apply visual for a given item id (not saving ownership)
  const it = SHOP_ITEMS.find(s=>s.id===id);
  if(!it) return;
  // call its apply logic (many apply functions are defined to be idempotent)
  try{ it.apply(); }catch(e){ console.error('apply error',e); }
  // track in user's activeEffects
  if(!users[currentUser].activeEffects.includes(id)) users[currentUser].activeEffects.push(id);
  saveUsers();
  updateCoins();
}
function removeEffectById(id){
  // reverse effect for an item id (only reverts visuals, not removing ownership)
  switch(id){
    case 'goldTitle':
    case 'rainbowTitle':
    case 'spinTitle': {
      const h=document.querySelector('h1'); if(h){ h.classList.remove('rainbow','spin'); h.style.background=''; h.style.color=''; }
      break;
    }
    case 'bluetheme': {
      document.documentElement.style.setProperty('--bg1','#1f1608'); document.documentElement.style.setProperty('--bg2','#352a13'); document.documentElement.style.setProperty('--accent','234,179,8');
      break;
    }
    case 'badgeRain': { document.querySelectorAll('.badge').forEach((b,i)=>{ if(i>24) b.remove(); }); break; }
    case 'partyMode': { document.body.classList.remove('party'); break; }
    case 'bigSplash': { const s=document.getElementById('splash'); if(s) s.style.fontSize=''; break; }
    case 'vipBadge': { /* coin counter shows crown only if owned; unequip doesn't remove ownership */ updateCoins(); break; }
    case 'teamCursor': { document.body.classList.remove('team-cursor'); break; }
    case 'clickSparks': { disableClickSparks(); break; }
    case 'petBadge': { disablePetBadge(); break; }
    case 'snowMode': { document.querySelectorAll('.snowflake').forEach(e=>e.remove()); snowOn=false; break; }
    case 'matrixRain': { document.querySelectorAll('.matrix-drop').forEach(e=>e.remove()); matrixRainOn=false; break; }

}

/* ---------- user shop helpers ---------- */
function buyItemForUser(id){
  if(!ensureUser()) return;
  const u = users[currentUser];
  const item = SHOP_ITEMS.find(s=>s.id===id);
  if(!item) return;
  if(u.owned.includes(id)) { toast('Already owned'); return; }
  const free = adminFlag('freeShop')||adminFlag('infGold') || (u && u.isAdmin);
  if(!free && u.coins < item.price){ toast('Not enough coins'); return; }
  if(!free) u.coins -= item.price;
  u.owned.push(id);
  saveUsers(); updateCoins(); toast('Purchased '+item.name);
  // auto-equip some items on buy (optional)
  if(item.id === 'goldTitle' || item.id === 'rainbowTitle' || item.id === 'spinTitle' || item.group === 'bg'){
    applyEffectById(id);
    if(item.group==='bg') setGradientForUser(GRAD_MAP[item.id]);
  } else {
    // non-bg: do not auto-equip by default, leave as owned
  }
  renderShop();
}

/* ---------- games rebuild: mark vip games (escape in name) and hide for non-vip ---------- */
let gamesRebuilt=false;
function rebuildGames(){
  const inputs=document.querySelectorAll('input[type="button"]');
  if(!inputs.length) return false;
  inputs.forEach(old=>{
    const wrapper=document.createElement('div'); wrapper.className='game';
    const btn=document.createElement('button'); btn.textContent=old.value;
    const orig=old.onclick;
    btn.onclick=(e)=>{ if(!ensureUser()) { toast('Please sign in to play'); return; } // require login to play
      // VIP gating: if game contains 'escape' and user is not vip/admin, prompt for VIP
      const title = btn.textContent.toLowerCase();
      if(title.includes('escape') || title.includes('escaperoad') || btn.dataset.vip==='true'){
        const u = users[currentUser];
        if(!(u && (u.isVIP || u.isAdmin))){ if(confirm('This is a VIP game. Enter admin code to unlock?')){ promptAdminForVIPAccess(); } else { toast('VIP access required'); return; } }
      }
      trackPlay(btn.textContent);
      if(orig) orig.call(old,e);
    };
    // mark VIP if name contains 'escape'
    if(old.value && old.value.toLowerCase().includes('escape')) btn.dataset.vip='true';
    const star=document.createElement('span'); star.className='star'; star.textContent = (users[currentUser] && users[currentUser].favourites && users[currentUser].favourites.includes(old.value)) ? '★':'☆';
    star.onclick=(e)=>{ e.stopPropagation(); if(!ensureUser()) return; const name=btn.textContent; const u = users[currentUser]; u.favourites = u.favourites||[]; if(u.favourites.includes(name)){ u.favourites = u.favourites.filter(x=>x!==name); star.textContent='☆'; } else { u.favourites.unshift(name); star.textContent='★'; } saveUsers(); };
    wrapper.appendChild(btn); wrapper.appendChild(star); old.replaceWith(wrapper);
  });
  gamesRebuilt=true; return true;
}

  mk('👑 Grant VIP to user', ()=>{ u.isVIP = true; saveUsers(); toast('User is VIP'); renderShop(); });
  mk('🚪 Log out admin', ()=>{ u.isAdmin = false; saveUsers(); toast('Admin privileges removed'); renderAdmin(); });
  const stats=document.createElement('p'); stats.style.cssText='font-size:12px;opacity:0.6;margin-top:14px';
  stats.innerHTML = '📊 User stats — coins: '+u.coins+'<br>games played: '+(u.plays||0)+'<br>badges clicked: '+(u.badgeClicks||0)+'<br>items owned: '+(u.owned?u.owned.length:0)+'/'+SHOP_ITEMS.length;
  p.appendChild(stats);
}

/* ---------- AUTH UI wiring ---------- */
function setupAuthUI(){
  // Splash overlay initializer: create animated shield emojis and wire Enter button
  const overlay = document.getElementById('authOverlay');
  const splashWrap = document.getElementById('splashOverlay');
  const enter = document.getElementById('enterSiteBtn');
  // create moving shields
  const count = 28;
  for(let i=0;i<count;i++){
    const s = document.createElement('div'); s.className='splash-shield'; s.textContent='🛡️';
    s.style.left = Math.random()*100+'%';
    s.style.fontSize = (14+Math.random()*48)+'px';
    s.style.opacity = 0.6+Math.random()*0.5;
    s.style.animationDuration = (8+Math.random()*14)+'s';
    s.style.animationDelay = (Math.random()*6)+'s';
    splashWrap.appendChild(s);
  }
  // dismiss overlay on Enter
  if(enter) enter.addEventListener('click', ()=>{ overlay.style.display='none'; setCurrentUser(null); toast('Welcome — continuing as guest'); });
  // also allow clicking background to dismiss
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) { overlay.style.display='none'; setCurrentUser(null); } });
}

/* ---------- apply user state to UI (coin counter, buttons enabled/disabled) ---------- */
function applyUserStateToUI(){
  updateCoins();
  // admin button wiring

  document.getElementById('gameListBtn').onclick = ()=> window.open('https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/','_blank');
  // coin counter click opens shop (requires login)

  // update coin counter text: include username
  const u = currentUser ? users[currentUser] : null;
  if(u) cc.title = 'Signed in as: ' + currentUser + (u.isVIP ? ' (VIP)' : '') + (u.isAdmin ? ' (ADMIN)' : '');

}

/* ---------- small helpers: close/open panels ---------- */
function closePanels(){ ['favPanel','shopPanel','recentPanel','adminPanel','vipPanel'].forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.remove('open'); }); }
function openShop(){ if(!ensureUser()){ toast('Sign in to access shop'); return; } const p=document.getElementById('shopPanel'); const wasOpen=p.classList.contains('open'); closePanels(); if(!wasOpen){ renderShop(); p.classList.add('open'); } }
function openFav(){ if(!ensureUser()){ toast('Sign in to use Favorites'); return; } listPanel('favPanel','⭐ Favorites', users[currentUser].favourites||[],'No favorites yet — hit the ☆ on any game.','★ '); }
function openRecent(){ if(!ensureUser()){ toast('Sign in to see recent'); return; } listPanel('recentPanel','🕘 Recently Played', users[currentUser].recent||[],'Nothing yet — go play something!'); }

/* generic panel helper */
function listPanel(id,title,items,emptyMsg,prefix){
  const p=document.getElementById(id); const wasOpen = p.classList.contains('open'); closePanels(); if(wasOpen) return;
  p.innerHTML = '<button class="panel-close" onclick="closePanels()">✕</button><h2>'+title+'</h2>';
  if(!items || !items.length) p.innerHTML += '<p style="opacity:0.6;font-size:13px">'+emptyMsg+'</p>';
  (items||[]).forEach(name=>{ const d=document.createElement('div'); d.textContent=(prefix||'')+name; d.style.cssText='margin:8px 0;cursor:pointer;padding:8px;border-radius:8px;background:rgba(255,255,255,0.06)'; d.onclick = ()=>{ const btn=[...document.querySelectorAll('.game button')].find(b=>b.textContent===name); if(btn) btn.click(); }; p.appendChild(d); });
  p.classList.add('open');
}

/* ---------- extra UI script: button ripples and entrance effects ---------- */
function applyCoolUI(){
  // add btn class to all buttons
  document.querySelectorAll('button').forEach(b=>{ b.classList.add('btn'); });
  // style specific buttons
  document.getElementById('lolbutton')?.classList.add('accent-btn');
  document.getElementById('coinCounter')?.classList.add('float-in');
  document.querySelectorAll('.shop-item button').forEach(b=>b.classList.add('accent-btn'));
  // ripple effect
  document.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', function(e){
      const r=document.createElement('span'); r.style.cssText='position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;background:rgba(255,255,255,0.18);transform:translate(-50%,-50%);pointer-events:none;opacity:0.9;';
      this.appendChild(r);
      const rect=this.getBoundingClientRect(); const x=e.clientX-rect.left; const y=e.clientY-rect.top; r.style.left = x+'px'; r.style.top = y+'px'; const size=Math.max(rect.width,rect.height)*1.8; r.animate([{width:'0px',height:'0px',opacity:0.9},{width:size+'px',height:size+'px',opacity:0}],{duration:420,easing:'cubic-bezier(.2,.9,.3,1)'});
      setTimeout(()=>r.remove(),450);
    });
  });
  // small floating animation for title
  const h=document.querySelector('h1'); if(h){ h.animate([{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}],{duration:4500,iterations:Infinity}); }
}
